<text class="nt" x="430" y="46.0" text-anchor="middle" fill="#0F172A">User says a passing model</text>
<text class="nt" x="430" y="64.0" text-anchor="middle" fill="#0F172A">already exists</text>
<rect class="n" style="--T:9.7s;--d:0.55s" fill="#F1F5F9" stroke="#64748B" x="210.0" y="116.0" width="440.0" height="40.0" rx="10"/>
