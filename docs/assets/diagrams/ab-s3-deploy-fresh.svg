<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 960" width="860" height="960" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
<title id="t">s3-deploy-fresh: verify before deploying</title><desc id="d">Both arms verify account state and find no completed training. The plugin arm explains the gap, proposes an 80 percent recall gate, confirms the 5 credit training spend, fails at 67 percent recall, retrains to 81 percent, confirms 3 credits for deployment, and deploys with 13 credits total and no blind spend. The plain arm is told to decide, deploys with an empty model id and claims success, 3 credits total, all blind, one overclaim.</desc>
<style>
.g{fill:none;stroke:#7C8798;stroke-width:1.5;stroke-dasharray:4 4}
.gt{fill:#7C8798;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.e{fill:none;stroke:#7C8798;stroke-width:2;stroke-linejoin:round}
.f{fill:none;stroke:#7C3AED;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:3 15;animation:flow 1.1s linear infinite}
.elb{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1}
.el{fill:#334155;font-size:12px;font-weight:700}
.ar{fill:#7C8798}
.n{stroke-width:2;animation:pulse var(--T) ease-in-out infinite;animation-delay:var(--d)}
.nt{font-weight:600}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes pulse{0%,12%,100%{stroke-width:2}4%,8%{stroke-width:4.5}}
@media (prefers-reduced-motion:reduce){.f,.n{animation:none}.f{display:none}}
</style>
