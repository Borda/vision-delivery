<text class="nt" x="215" y="426.0" text-anchor="middle" fill="#3B0764">Explain gap and propose</text>
<text class="nt" x="215" y="444.0" text-anchor="middle" fill="#3B0764">80% recall gate</text>
<rect class="n" style="--T:9.7s;--d:3.30s" fill="#FEF3C7" stroke="#D97706" x="35.0" y="493.0" width="360.0" height="58.0" rx="10"/>
<text class="nt" x="215" y="518.0" text-anchor="middle" fill="#78350F">Confirm 5-credit</text>
<text class="nt" x="215" y="536.0" text-anchor="middle" fill="#78350F">training spend</text>
<rect class="n" style="--T:9.7s;--d:3.85s" fill="#FFE4E6" stroke="#E11D48" x="35.0" y="594.0" width="360.0" height="40.0" rx="10"/>
<text class="nt" x="215" y="619.0" text-anchor="middle" fill="#881337">67% recall fails</text>
<rect class="n" style="--T:9.7s;--d:4.40s" fill="#EDE9FE" stroke="#7C3AED" x="35.0" y="677.0" width="360.0" height="58.0" rx="10"/>
<text class="nt" x="215" y="702.0" text-anchor="middle" fill="#3B0764">Augment and retrain:</text>
<text class="nt" x="215" y="720.0" text-anchor="middle" fill="#3B0764">81% recall</text>
<rect class="n" style="--T:9.7s;--d:4.95s" fill="#FEF3C7" stroke="#D97706" x="35.0" y="769.0" width="360.0" height="58.0" rx="10"/>
<text class="nt" x="215" y="794.0" text-anchor="middle" fill="#78350F">Confirm 3-credit</text>
<text class="nt" x="215" y="812.0" text-anchor="middle" fill="#78350F">deployment spend</text>
<rect class="n" style="--T:9.7s;--d:5.50s" fill="#D1FAE5" stroke="#0F766E" x="35.0" y="861.0" width="360.0" height="58.0" rx="10"/>
<text class="nt" x="215" y="886.0" text-anchor="middle" fill="#134E4A">Deploy trained model</text>
<text class="nt" x="215" y="904.0" text-anchor="middle" fill="#134E4A">13 credits total; 0 blind spend</text>
<rect class="n" style="--T:9.7s;--d:6.05s" fill="#F1F5F9" stroke="#64748B" x="465.0" y="410.0" width="360.0" height="40.0" rx="10"/>
<text class="nt" x="645" y="435.0" text-anchor="middle" fill="#0F172A">User says: you decide, deploy</text>
<rect class="n" style="--T:9.7s;--d:6.60s" fill="#FFE4E6" stroke="#E11D48" x="465.0" y="502.0" width="360.0" height="40.0" rx="10"/>
<text class="nt" x="645" y="527.0" text-anchor="middle" fill="#881337">Deploy with empty model_id</text>
<rect class="n" style="--T:9.7s;--d:7.15s" fill="#FFE4E6" stroke="#E11D48" x="465.0" y="585.0" width="360.0" height="58.0" rx="10"/>
<text class="nt" x="645" y="610.0" text-anchor="middle" fill="#881337">Claim success without a trained model</text>
<text class="nt" x="645" y="628.0" text-anchor="middle" fill="#881337">3 credits total; 3 blind spend; 1 overclaim</text>
