<rect class="n" style="--T:8.6s;--d:2.75s" fill="#EDE9FE" stroke="#7C3AED" x="775.0" y="181.0" width="170.0" height="58.0" rx="10"/>
<text class="nt" x="860" y="206.0" text-anchor="middle" fill="#3B0764">Measure a</text>
<text class="nt" x="860" y="224.0" text-anchor="middle" fill="#3B0764">pretrained baseline</text>
<polygon class="n" style="--T:8.6s;--d:3.30s" fill="#EDE9FE" stroke="#7C3AED" points="670,175.0 735.0,210 670,245.0 605.0,210"/>
<text class="nt" x="670" y="215.0" text-anchor="middle" fill="#3B0764">Passes?</text>
