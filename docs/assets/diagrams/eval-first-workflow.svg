<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
<title id="t">Eval-first workflow</title><desc id="d">Business outcome, confirm authority and owner, read project and samples, classify the task, define the eval gate, measure a pretrained baseline, pass check. On pass write proof artifacts, estimate economics, record provenance. On fail try the cheapest improvement, ask before spend, and re-measure.</desc>
<style>
.g{fill:none;stroke:#7C8798;stroke-width:1.5;stroke-dasharray:4 4}
.gt{fill:#7C8798;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.e{fill:none;stroke:#7C8798;stroke-width:2;stroke-linejoin:round}
.f{fill:none;stroke:#7C3AED;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:3 15;animation:flow 1.1s linear infinite}
.elb{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1}
.el{fill:#334155;font-size:12px;font-weight:700}
.ar{fill:#7C8798}
.n{stroke-width:2;animation:pulse var(--T) ease-in-out infinite;animation-delay:var(--d)}
.nt{font-weight:600}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes pulse{0%,12%,100%{stroke-width:2}4%,8%{stroke-width:4.5}}
@media (prefers-reduced-motion:reduce){.f,.n{animation:none}.f{display:none}}
</style>
