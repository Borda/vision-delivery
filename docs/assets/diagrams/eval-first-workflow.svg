<text class="nt" x="670" y="374.0" text-anchor="middle" fill="#78350F">improvement</text>
<rect class="n" style="--T:8.6s;--d:6.05s" fill="#FEF3C7" stroke="#D97706" x="785.0" y="331.0" width="150.0" height="58.0" rx="10"/>
<text class="nt" x="860" y="356.0" text-anchor="middle" fill="#78350F">Ask before</text>
<text class="nt" x="860" y="374.0" text-anchor="middle" fill="#78350F">spend</text>
